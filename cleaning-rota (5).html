<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Cleaning Rota</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --green: #2d6a4f;
    --green-light: #d8f3dc;
    --text: #1b1b1b;
    --muted: #6b7a72;
    --bg: #f4f9f5;
    --card: #ffffff;
    --border: #c8e6d0;
  }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
  }
  .wrap { width: 100%; max-width: 380px; }
  .header { text-align: center; margin-bottom: 2rem; animation: fadeUp 0.5s ease both; }
  .broom { font-size: 2.5rem; display: block; margin-bottom: 0.5rem; }
  h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; color: var(--green); }
  .week-label { font-family: 'DM Mono', monospace; font-size: 0.8rem; color: var(--muted); margin-top: 0.25rem; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.5rem;
    margin-bottom: 1rem;
    animation: fadeUp 0.5s ease both;
    animation-delay: 0.1s;
  }
  .task-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.85rem 0;
    border-bottom: 1px solid var(--green-light);
  }
  .task-row:last-child { border-bottom: none; padding-bottom: 0; }
  .task-row:first-child { padding-top: 0; }
  .task-name { font-size: 0.85rem; color: var(--muted); font-family: 'DM Mono', monospace; text-transform: uppercase; letter-spacing: 0.05em; }
  .person { font-size: 1.1rem; font-weight: 600; color: var(--green); }
  .whatsapp-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    width: 100%;
    padding: 1rem;
    background: #25D366;
    color: white;
    border: none;
    border-radius: 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    animation: fadeUp 0.5s ease both;
    animation-delay: 0.2s;
    transition: transform 0.1s, background 0.1s;
  }
  .whatsapp-btn:active { transform: scale(0.97); background: #1db954; }
  .whatsapp-icon { width: 22px; height: 22px; fill: white; flex-shrink: 0; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <span class="broom">🧹</span>
    <h1>Cleaning Rota</h1>
    <p class="week-label" id="week-label"></p>
  </div>
  <div class="card">
    <div class="task-row">
      <span class="task-name">Kitchen</span>
      <span class="person" id="kitchen"></span>
    </div>
    <div class="task-row">
      <span class="task-name">Sitting room</span>
      <span class="person" id="sitting"></span>
    </div>
    <div class="task-row">
      <span class="task-name">Bathroom</span>
      <span class="person" id="bathroom"></span>
    </div>
  </div>
  <a class="whatsapp-btn" id="wa-btn" href="#">
    <svg class="whatsapp-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
    </svg>
    Send to group
  </a>
</div>

<script>
  const rota = {
    23: {k:'Molly',    s:'Ash',      b:'Eva'},
    24: {k:'Michelle', s:'Molly',    b:'Molly'},
    25: {k:'Lauren',   s:'Michelle', b:'Ash'},
    26: {k:'Ali',      s:'Lauren',   b:'Ali'},
    27: {k:'Nathan',   s:'Ali',      b:'Michelle'},
    28: {k:'Eva',      s:'Nathan',   b:'Eva'},
    29: {k:'Ash',      s:'Eva',      b:'Molly'},
    30: {k:'Molly',    s:'Ash',      b:'Ash'},
    31: {k:'Michelle', s:'Molly',    b:'Ali'},
    32: {k:'Lauren',   s:'Michelle', b:'Michelle'},
    33: {k:'Ali',      s:'Lauren',   b:'Eva'},
    34: {k:'Nathan',   s:'Ali',      b:'Molly'},
    35: {k:'Eva',      s:'Nathan',   b:'Ash'},
    36: {k:'Ash',      s:'Eva',      b:'Ali'},
    37: {k:'Molly',    s:'Ash',      b:'Michelle'},
    38: {k:'Michelle', s:'Molly',    b:'Eva'},
    39: {k:'Lauren',   s:'Michelle', b:'Molly'},
    40: {k:'Ali',      s:'Lauren',   b:'Ash'},
    41: {k:'Nathan',   s:'Ali',      b:'Ali'},
    42: {k:'Eva',      s:'Nathan',   b:'Michelle'},
    43: {k:'Ash',      s:'Eva',      b:'Eva'},
    44: {k:'Molly',    s:'Ash',      b:'Molly'},
    45: {k:'Michelle', s:'Molly',    b:'Ash'},
    46: {k:'Lauren',   s:'Michelle', b:'Ali'},
    47: {k:'Ali',      s:'Lauren',   b:'Michelle'},
    48: {k:'Nathan',   s:'Ali',      b:'Eva'},
    49: {k:'Eva',      s:'Nathan',   b:'Molly'},
    50: {k:'Ash',      s:'Eva',      b:'Ash'},
    51: {k:'Molly',    s:'Ash',      b:'Ali'},
    52: {k:'Michelle', s:'Molly',    b:'Michelle'}
  };

  function getISOWeek(date) {
    const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
    const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  }

  const now = new Date();
  const ANCHOR = new Date(2026, 5, 8);
  const msPerWeek = 7 * 24 * 60 * 60 * 1000;
  const weekOffset = Math.floor((now - ANCHOR) / msPerWeek);
  const weekNum = 23 + weekOffset;

  const week = rota[weekNum];

  const dayOfWeek = now.getDay() === 0 ? 6 : now.getDay() - 1;
  const monday = new Date(now);
  monday.setDate(now.getDate() - dayOfWeek);
  const dateStr = monday.toLocaleDateString('en-IE', { day: 'numeric', month: 'long' }).replace(/(\d+)/, d => {
    const s = ['th','st','nd','rd']; const v = d%100; return d+(s[(v-20)%10]||s[v]||s[0]);
  });

  if (week) {
    document.getElementById('kitchen').textContent  = week.k;
    document.getElementById('sitting').textContent  = week.s;
    document.getElementById('bathroom').textContent = week.b;
    document.getElementById('week-label').textContent = dateStr;
    const msg = encodeURIComponent(`Cleaning Rota - ${dateStr}\nKitchen: ${week.k}\nSitting room: ${week.s}\nBathroom: ${week.b}`);
    document.getElementById('wa-btn').href = `whatsapp://send?text=${msg}`;
  } else {
    document.getElementById('kitchen').textContent  = '—';
    document.getElementById('sitting').textContent  = '—';
    document.getElementById('bathroom').textContent = '—';
    document.getElementById('week-label').textContent = 'no rota for this week';
  }
</script>
</body>
</html>
